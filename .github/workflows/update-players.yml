name: Update Player Data

# Console-only refresh (pro and streamer players ride along because there are only ~200 of them).
# PC players are no longer refreshed here: the console weekly report and the console pages are what this feeds.
#
# The checkout is sparse and blob-less on purpose. The whole repo is ~12 GB (9.8 GB of it PC player files), and a
# full checkout used to eat ~50 minutes of the 180 minute cap before the fetch even started. Now only the scripts
# and a few small files are checked out, the batch is chosen from the file LIST (git ls-tree), and just the
# batch's own data files are pulled in before the fetch.
#
# build_aggregate.py is NOT run here any more: it reads every group (including PC), so it needs the full checkout.
# backfill.yml (every 2 hours) and the other full-checkout workflows still rebuild the aggregates.
on:
  schedule:
    - cron: "43 */4 * * *"
  # Editing this workflow also starts a run, so a change to it can be tried straight away.
  push:
    branches: [main]
    paths:
      - ".github/workflows/update-players.yml"
  workflow_dispatch:
    inputs:
      player_ids:
        description: "Comma-separated profileIds to update (leave empty for the normal rotating batch)"
        required: false
        default: ""
      pages:
        description: "Max pages to fetch per player — safety cap only, update_players.py stops early once a page has zero new matches (default 10)"
        required: false
        default: "10"
      dry_run:
        description: "Fetch but don't commit (true/false)"
        required: false
        default: "false"
      repair:
        description: "Clear existing data before re-fetching, fixes null civ/won (true/false)"
        required: false
        default: "false"
      group:
        description: "Group for force-added players (console/pro/pc/streamer)"
        required: false
        default: "console"
      loop:
        description: "Chain into Backfill on completion (true/false)"
        required: false
        default: "false"

# Its own concurrency group, not the shared player-data-write one. With the shared group, backfill.yml (every 2 hours,
# 80-100 minutes a run) kept taking the single "pending" slot and a waiting update run was cancelled when the next
# backfill queued, so about half the scheduled console refreshes never ran. The two workflows touch different files
# (this one: data/console, data/pro, data/streamer, the cursors, the checked-dates file and the health file; backfill:
# the PC data, the queue and the aggregates), and both already retry a rejected push with `git pull --rebase`.
concurrency:
  group: player-data-update
  cancel-in-progress: false

env:
  # Console players per run, rotated with their own cursor (data/refresh_cursor_console.json). The rest pool
  # (pro + streamer, ~200 players) is refreshed in full every run. ~4 s per player means ~1300 players is
  # ~85 minutes of fetching; with the now-small checkout that fits the 180 minute cap with room to spare.
  # 6 runs a day x 1100 = 6600 console players a day against a pool of ~3600, so the pool is covered about
  # every 14 hours even if a couple of runs are skipped.
  CONSOLE_BATCH_SIZE: "1100"
  REFRESH_BATCH_SIZE: "1400"

jobs:
  update:
    runs-on: ubuntu-latest
    # A firm cap so a hung run frees the shared player-data-write lock instead of blocking every other writer.
    timeout-minutes: 180
    permissions:
      contents: write
      actions: write
    steps:
      - name: Checkout repo (sparse, no file contents yet)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            /*.py
            players.json
            data/refresh_cursor.json
            data/refresh_cursor_console.json
            data/refresh_checked.json
            data/pipeline_health.json
          sparse-checkout-cone-mode: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install requests
      - name: Run API test
        id: api_test
        run: |
          python3 - <<'EOF'
          import json, urllib.request, urllib.parse, sys
          url = "https://data.aoe2companion.com/api/matches?" + urllib.parse.urlencode({"profile_ids": 13648083, "page": 1})
          req = urllib.request.Request(url, headers={"User-Agent": "AoE2DataPipeline/1.0"})
          resp = urllib.request.urlopen(req, timeout=20)
          data = json.loads(resp.read().decode())
          matches = data["matches"] if isinstance(data, dict) else data
          m = matches[0]
          print("API reachable — match keys:", sorted(m.keys()))
          EOF
      - name: Compute refresh batch
        id: batch
        if: github.event.inputs.player_ids == ''
        run: |
          python3 - <<'EOF'
          import json, os, subprocess
          from pathlib import Path

          CONSOLE_BATCH_SIZE = int(os.environ["CONSOLE_BATCH_SIZE"])
          REST_BATCH_SIZE = int(os.environ["REFRESH_BATCH_SIZE"]) - CONSOLE_BATCH_SIZE

          def rotate(pool, batch_size, cursor_path):
              cursor = json.loads(cursor_path.read_text())["index"] if cursor_path.exists() else 0
              if not pool:
                  batch, next_cursor = [], 0
              elif len(pool) <= batch_size:
                  batch, next_cursor = pool, 0
              else:
                  start = cursor % len(pool)
                  batch = (pool[start:] + pool[:start])[:batch_size]
                  next_cursor = (start + batch_size) % len(pool)
              cursor_path.write_text(json.dumps({"index": next_cursor}, indent=2))
              return batch, cursor, next_cursor

          data_dir = Path("data")
          players = json.loads(Path("players.json").read_text())
          # Which players have a data file, from git's file list (the files themselves are not checked out).
          listing = subprocess.run(["git", "ls-tree", "-r", "--name-only", "HEAD", "data/console/", "data/pro/", "data/streamer/"],
                                   capture_output=True, text=True, check=True).stdout.split()
          have = set(listing)
          tracked = [
              p for p in players
              if p.get("group", "console") in ("console", "pro", "streamer")
              and f"data/{p.get('group', 'console')}/{p['profileId']}.json" in have
          ]
          console_pool = sorted(p["profileId"] for p in tracked if p.get("group", "console") == "console")
          rest_pool = sorted(p["profileId"] for p in tracked if p.get("group", "console") != "console")

          console_batch, console_cursor, console_next = rotate(console_pool, CONSOLE_BATCH_SIZE, data_dir / "refresh_cursor_console.json")
          rest_batch, rest_cursor, rest_next = rotate(rest_pool, REST_BATCH_SIZE, data_dir / "refresh_cursor.json")
          batch = console_batch + rest_batch

          print(f"Console pool: {len(console_pool)} — refreshing {len(console_batch)} this run, cursor {console_cursor} -> {console_next}")
          print(f"Rest pool (pro + streamer): {len(rest_pool)} — refreshing {len(rest_batch)} this run, cursor {rest_cursor} -> {rest_next}")

          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write("player_ids=" + ",".join(str(i) for i in batch) + "\n")
          EOF
      - name: Commit and push cursor advance
        # Push the cursor's new position BEFORE the slow fetch, so a run that later times out only means that batch
        # waits one rotation instead of the same batch being retried forever.
        if: github.event.inputs.player_ids == ''
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/refresh_cursor.json data/refresh_cursor_console.json
          if git diff --staged --quiet; then
            echo "Cursor unchanged — nothing to commit"
            exit 0
          fi
          NEXT_INDEX=$(python3 -c "import json; print(json.load(open('data/refresh_cursor.json'))['index'])")
          NEXT_CONSOLE_INDEX=$(python3 -c "import json; print(json.load(open('data/refresh_cursor_console.json'))['index'])")
          git commit -m "chore: advance refresh cursor to $NEXT_INDEX (console: $NEXT_CONSOLE_INDEX)"
          for attempt in 1 2 3; do
            if git push; then
              echo "Cursor pushed on attempt $attempt"
              exit 0
            fi
            echo "::warning::cursor push attempt $attempt failed — resyncing and retrying"
            git pull --rebase
            sleep $((5 * attempt))
          done
          echo "::error::Failed to push cursor advance after 3 attempts"
          exit 1
      - name: Check out the batch's data files
        # Pull in only the files this run will read and rewrite. update_players.py treats a missing file as a brand new
        # player, so every file is verified to be present before the fetch starts.
        run: |
          IDS="${{ github.event.inputs.player_ids }}"
          if [ -z "$IDS" ]; then IDS="${{ steps.batch.outputs.player_ids }}"; fi
          IDS="$IDS" python3 - <<'EOF'
          import json, os, subprocess
          from pathlib import Path

          ids = [i for i in os.environ["IDS"].split(",") if i.strip()]
          players = {str(p["profileId"]): p.get("group", "console") for p in json.loads(Path("players.json").read_text())}
          listing = set(subprocess.run(["git", "ls-tree", "-r", "--name-only", "HEAD", "data/"],
                                       capture_output=True, text=True, check=True).stdout.split())
          want = []
          for i in ids:
              path = f"data/{players.get(i, 'console')}/{i}.json"
              if path in listing:
                  want.append(path)
              else:
                  print(f"{i}: no data file yet ({path}) — it will be created as a new player")
          if want:
              with open(".git/info/sparse-checkout", "a") as f:
                  f.write("\n" + "\n".join("/" + p for p in want) + "\n")
              subprocess.run(["git", "sparse-checkout", "reapply"], check=True)
          missing = [p for p in want if not Path(p).exists()]
          print(f"Checked out {len(want) - len(missing)} of {len(want)} data files")
          if missing:
              raise SystemExit(f"{len(missing)} data files did not check out, e.g. {missing[:3]} — stopping so nothing is overwritten")
          EOF
      - name: Update player data
        id: update
        run: |
          ARGS=""
          if [ -n "${{ github.event.inputs.player_ids }}" ]; then
            ARGS="$ARGS --players ${{ github.event.inputs.player_ids }}"
          elif [ -n "${{ steps.batch.outputs.player_ids }}" ]; then
            ARGS="$ARGS --players ${{ steps.batch.outputs.player_ids }}"
          fi
          if [ -n "${{ github.event.inputs.pages }}" ]; then
            ARGS="$ARGS --pages ${{ github.event.inputs.pages }}"
          fi
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          if [ "${{ github.event.inputs.repair }}" = "true" ]; then
            ARGS="$ARGS --repair"
          fi
          if [ -n "${{ github.event.inputs.group }}" ]; then
            ARGS="$ARGS --group ${{ github.event.inputs.group }}"
          fi
          python3 update_players.py $ARGS
      - name: Write pipeline health
        # DATA_CHANGED must be computed from `git status` before this writes data/pipeline_health.json (that file's
        # own timestamp changes every run). HEALTH_FROM_GIT_TREE makes the script read the pool from git's file list and
        # freshness from data/refresh_checked.json, because only the batch's files are checked out here.
        run: |
          if [ -n "$(git status --porcelain -- data/ players.json)" ]; then
            export DATA_CHANGED=true
          else
            export DATA_CHANGED=false
          fi
          HEALTH_FROM_GIT_TREE=1 python3 write_pipeline_health.py
      - name: Commit and push if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add --sparse data/ players.json
          if git diff --staged --quiet; then
            echo "Nothing to commit"
            exit 0
          fi
          git commit -m "chore: auto-update player data $(date -u '+%Y-%m-%d %H:%M')"
          for attempt in 1 2 3; do
            if git push; then
              echo "Pushed on attempt $attempt"
              exit 0
            fi
            echo "::warning::push attempt $attempt failed (likely a concurrent commit) — resyncing and retrying"
            git pull --rebase
            sleep $((5 * attempt))
          done
          echo "::error::Failed to push player data after 3 attempts — this run's fetched data was NOT saved to origin"
          exit 1
      - name: Trigger Backfill if looping
        if: success() && github.event.inputs.dry_run != 'true' && (github.event.inputs.loop == 'true' || github.event_name == 'schedule')
        run: |
          gh workflow run backfill.yml \
            --ref main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
