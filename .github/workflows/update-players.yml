name: Update Player Data
on:
  schedule:
    - cron: "43 */6 * * *"
  workflow_dispatch:
    inputs:
      player_ids:
        description: "Comma-separated profileIds to update (leave empty for all)"
        required: false
        default: ""
      pages:
        description: "Max pages to fetch per player — safety cap only, update_players.py stops early once a page has zero new matches (default 10)"
        required: false
        default: "10"
      dry_run:
        description: "Fetch but don't commit (true/false)"
        required: false
        default: "false"
      repair:
        description: "Clear existing data before re-fetching, fixes null civ/won (true/false)"
        required: false
        default: "false"
      group:
        description: "Group for force-added players (console/pro/pc/streamer)"
        required: false
        default: "console"
      loop:
        description: "Chain into Backfill on completion (true/false)"
        required: false
        default: "false"

concurrency:
  group: player-data-write
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    # No explicit cap before meant a hang fell back to GitHub's 360min
    # default — and because this shares the player-data-write concurrency
    # group with cancel-in-progress:false, a single hung run blocked every
    # subsequent scheduled/chained trigger behind it indefinitely (this is
    # what caused the week-long update outage on 2026-08-23). A firm cap
    # guarantees the lock frees up every cycle even if a run gets stuck.
    timeout-minutes: 180
    permissions:
      contents: write
      actions: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install requests
      - name: Run API test
        id: api_test
        run: |
          python3 - <<'EOF'
          import json, urllib.request, urllib.parse, sys
          url = "https://data.aoe2companion.com/api/matches?" + urllib.parse.urlencode({"profile_ids": 13648083, "page": 1})
          req = urllib.request.Request(url, headers={"User-Agent": "AoE2DataPipeline/1.0"})
          resp = urllib.request.urlopen(req, timeout=20)
          data = json.loads(resp.read().decode())
          matches = data["matches"] if isinstance(data, dict) else data
          m = matches[0]
          print("API reachable — match keys:", sorted(m.keys()))
          EOF
      - name: Migrate to subfolders (safe to run multiple times)
        run: python3 migrate_to_subfolders.py
      - name: Compute refresh batch
        id: batch
        if: github.event.inputs.player_ids == ''
        run: |
          python3 - <<'EOF'
          import json, os
          from pathlib import Path

          # Refreshing the FULL already-backfilled roster every run used to
          # be fine, but that scope only grows as backfill.yml keeps adding
          # players — by 2026-08-16 it had grown enough that a full pass
          # started taking longer than this job's timeout, so every run got
          # killed mid-way with nothing committed, forever (the root cause
          # of the week-long outage this was added to fix). Rotating a
          # bounded batch each run keeps runtime predictable regardless of
          # how large the backfilled pool gets — freshness per player
          # degrades gracefully (a full rotation just takes more cycles)
          # instead of the whole pipeline breaking.
          BATCH_SIZE = 2500

          data_dir = Path("data")
          players = json.loads(Path("players.json").read_text())
          scoped = sorted(
              p["profileId"] for p in players
              if (data_dir / p.get("group", "console") / f"{p['profileId']}.json").exists()
          )

          cursor_path = data_dir / "refresh_cursor.json"
          cursor = json.loads(cursor_path.read_text())["index"] if cursor_path.exists() else 0

          if not scoped:
              batch = []
              next_cursor = 0
          elif len(scoped) <= BATCH_SIZE:
              batch = scoped
              next_cursor = 0
          else:
              start = cursor % len(scoped)
              # wrap around the end of the list back to the start
              batch = (scoped[start:] + scoped[:start])[:BATCH_SIZE]
              next_cursor = (start + BATCH_SIZE) % len(scoped)

          cursor_path.write_text(json.dumps({"index": next_cursor}, indent=2))
          print(f"Scoped pool: {len(scoped)} — refreshing {len(batch)} this run, cursor {cursor} -> {next_cursor}")

          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write("player_ids=" + ",".join(str(i) for i in batch) + "\n")
          EOF
      - name: Update player data
        id: update
        run: |
          ARGS=""
          if [ -n "${{ github.event.inputs.player_ids }}" ]; then
            ARGS="$ARGS --players ${{ github.event.inputs.player_ids }}"
          elif [ -n "${{ steps.batch.outputs.player_ids }}" ]; then
            ARGS="$ARGS --players ${{ steps.batch.outputs.player_ids }}"
          fi
          if [ -n "${{ github.event.inputs.pages }}" ]; then
            ARGS="$ARGS --pages ${{ github.event.inputs.pages }}"
          fi
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          if [ "${{ github.event.inputs.repair }}" = "true" ]; then
            ARGS="$ARGS --repair"
          fi
          if [ -n "${{ github.event.inputs.group }}" ]; then
            ARGS="$ARGS --group ${{ github.event.inputs.group }}"
          fi
          python3 update_players.py $ARGS
      - name: Build aggregate
        run: python3 build_aggregate.py
      - name: Commit and push if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ players.json
          git diff --staged --quiet || git commit -m "chore: auto-update player data $(date -u '+%Y-%m-%d')"
          git pull --rebase && git push || echo "Nothing to push"
      - name: Trigger Backfill if looping
        # A one-shot nudge (no loop=true) — backfill.yml no longer
        # auto-chains off queue-remaining, so this doesn't restart the
        # continuous self-chain that was starving this very workflow's
        # own cron out of the shared concurrency lock. Backfill still
        # gets one extra round after each refresh, plus its normal 2h
        # cron for ongoing progress.
        if: success() && github.event.inputs.dry_run != 'true' && (github.event.inputs.loop == 'true' || github.event_name == 'schedule')
        run: |
          gh workflow run backfill.yml \
            --ref main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
