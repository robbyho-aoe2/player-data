name: Unstick Pipeline

# Runs independently of update-players.yml / backfill.yml (own concurrency
# group) so it keeps working even while those are stuck. If either workflow
# has a run that's been in_progress or queued longer than STUCK_MINUTES, it
# cancels it — freeing the shared player-data-write concurrency lock so the
# next scheduled/chained run can start. This is what makes the pipeline
# self-heal from a hang without anyone needing to watch it: see the outage
# on 2026-08-23 where Update Player Data hung past its timeout and every
# later trigger just queued up and got cancelled behind it, forever.

on:
  schedule:
    - cron: "*/20 * * * *"
  workflow_dispatch:

concurrency:
  group: player-data-watchdog
  cancel-in-progress: true

jobs:
  unstick:
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Cancel runs stuck past their expected duration
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          # Generous margin above each workflow's own timeout-minutes (180
          # for update-players.yml, 340 for backfill.yml) — this is a
          # backstop for the rare case a run doesn't self-terminate on
          # time, not the primary timeout mechanism.
          STUCK_MINUTES=200
          now=$(date -u +%s)

          for wf in update-players.yml backfill.yml; do
            for status in in_progress queued; do
              echo "Checking $wf ($status runs) ..."
              gh run list --repo "$REPO" --workflow "$wf" --status "$status" \
                --json databaseId,createdAt,status --limit 20 |
              jq -c '.[]' | while read -r run; do
                id=$(echo "$run" | jq -r '.databaseId')
                created=$(echo "$run" | jq -r '.createdAt')
                created_ts=$(date -u -d "$created" +%s)
                age_min=$(( (now - created_ts) / 60 ))
                echo "  run $id created $created (${age_min}m ago)"
                if [ "$age_min" -gt "$STUCK_MINUTES" ]; then
                  echo "  -> stuck for ${age_min}m, cancelling"
                  gh run cancel "$id" --repo "$REPO" || true
                fi
              done
            done
          done
