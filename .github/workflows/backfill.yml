name: Backfill New Players
on:
  schedule:
    - cron: "17 */2 * * *"
  workflow_dispatch:
    inputs:
      pages:
        description: "Pages to fetch per player (default 1000)"
        required: false
        default: "1000"
      max_players:
        description: "Max players to process per run (default 40)"
        required: false
        default: "40"
      dry_run:
        description: "Fetch but don't commit (true/false)"
        required: false
        default: "false"
      loop:
        description: "Chain into Update Player Data on completion (true/false)"
        required: false
        default: "false"

concurrency:
  group: player-data-write
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    permissions:
      contents: write
      actions: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Read backfill queue
        id: read_queue
        run: |
          python3 - <<'EOF'
          import json, os
          from pathlib import Path

          max_players  = int(os.environ.get("MAX_PLAYERS", "40"))
          queue_path   = Path("data/backfill_queue.json")
          players_path = Path("players.json")

          if not queue_path.exists():
              print("No backfill_queue.json found — nothing to do.")
              with open(os.environ["GITHUB_OUTPUT"], "a") as f:
                  f.write("has_queue=false\n")
          else:
              all_ids = json.loads(queue_path.read_text())
              # A bad entry (e.g. a stray null from a players.json record
              # with no profileId) shouldn't crash the whole batch — drop
              # it and keep going.
              bad = [x for x in all_ids if not isinstance(x, int)]
              if bad:
                  print(f"Dropping {len(bad)} invalid queue entr{'y' if len(bad)==1 else 'ies'}: {bad!r}")
                  all_ids = [x for x in all_ids if isinstance(x, int)]
                  queue_path.write_text(json.dumps(all_ids, indent=2))
              if not all_ids:
                  print("Queue is empty — nothing to do.")
                  with open(os.environ["GITHUB_OUTPUT"], "a") as f:
                      f.write("has_queue=false\n")
              else:
                  # Prioritize console players — they move to the front of the
                  # queue (stable sort, so arrival order is preserved within
                  # each priority tier).
                  group_of = {}
                  if players_path.exists():
                      for p in json.loads(players_path.read_text()):
                          group_of[p["profileId"]] = p.get("group")

                  all_ids.sort(key=lambda pid: 0 if group_of.get(pid) == "console" else 1)

                  batch    = all_ids[:max_players]
                  remaining = all_ids[max_players:]
                  id_str   = ",".join(str(i) for i in batch)
                  print(f"Queue total: {len(all_ids)} — processing {len(batch)} (console-prioritized), leaving {len(remaining)}")
                  print(f"Batch: {id_str}")

                  # Write remaining back to queue (not cleared until empty)
                  queue_path.write_text(json.dumps(remaining, indent=2))

                  with open(os.environ["GITHUB_OUTPUT"], "a") as f:
                      f.write(f"has_queue=true\n")
                      f.write(f"queue_ids={id_str}\n")
                      f.write(f"queue_count={len(batch)}\n")
                      f.write(f"remaining={len(remaining)}\n")
          EOF
        env:
          MAX_PLAYERS: ${{ github.event.inputs.max_players || '40' }}

      - name: Backfill player data
        if: steps.read_queue.outputs.has_queue == 'true'
        run: |
          ARGS="--players ${{ steps.read_queue.outputs.queue_ids }} --pages ${{ github.event.inputs.pages || '1000' }}"
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          echo "Running: python3 update_players.py $ARGS"
          python3 update_players.py $ARGS

      - name: Build aggregate
        if: steps.read_queue.outputs.has_queue == 'true' && github.event.inputs.dry_run != 'true'
        run: python3 build_aggregate.py

      - name: Commit and push if changed
        if: github.event.inputs.dry_run != 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ players.json
          git diff --staged --quiet || git commit -m "chore: backfill ${{ steps.read_queue.outputs.queue_count }} players, ${{ steps.read_queue.outputs.remaining }} remaining $(date -u '+%Y-%m-%d')"
          git pull --rebase && git push || echo "Nothing to push"

      - name: Trigger another Backfill round if looping
        # Only chains on an EXPLICIT loop=true dispatch — it used to also
        # auto-chain whenever queue remained (i.e. always, given an 85k+
        # backlog), which meant this workflow re-claimed the shared
        # player-data-write concurrency lock the instant each ~80min batch
        # finished, starving Update Player Data's 6h cron out of the
        # lock's single queued slot indefinitely (observed 2026-08-24).
        #
        # IMPORTANT: this dispatches the next round WITHOUT --field
        # loop=true. The first fix here still passed loop=true forward,
        # which meant any chain already seeded with loop=true (every
        # link before this fix, and any future manual loop=true dispatch)
        # kept perpetuating itself under the new gate too — same
        # starvation, just relabeled. loop=true is now consumed by
        # exactly one extra round: this step fires once for the run that
        # requested it, then stops, instead of manufacturing a new
        # opt-in each generation. Chain a longer burst explicitly (repeat
        # manual loop=true dispatches) if one is ever actually wanted.
        if: success() && github.event.inputs.dry_run != 'true' && github.event.inputs.loop == 'true'
        run: |
          gh workflow run backfill.yml \
            --ref main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
