name: Weekly Customs

# The Console Weekly Report routine (Mondays 12:00 UTC) runs in a sandbox that aoe2companion sometimes refuses with a 403,
# so its report can go out without the "most customs" fields. This runs afterwards on GitHub's runners, which can reach the
# API, and fills them in on the newest report if they are missing. See patch_weekly_customs.py. It does nothing when the
# fields are already there, so the extra runs (the routine can be late, or retried by hand) are harmless.

on:
  schedule:
    - cron: "45 13 * * 1"
    - cron: "45 16 * * 1"
    - cron: "45 13 * * 2"
  workflow_dispatch:
    inputs:
      date:
        description: "Report date to patch, YYYY-MM-DD (default: the newest report)"
        required: false
        default: ""

# Its own group: the job only touches data/weekly-reports/, and a push conflict is handled by the retry loop below.
concurrency:
  group: weekly-customs
  cancel-in-progress: false

jobs:
  customs:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            /*.py
            players.json
            data/weekly-reports
          sparse-checkout-cone-mode: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Fill in the custom-game fields
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          DATE_ARG=""
          if [ -n "${{ github.event.inputs.date }}" ]; then DATE_ARG="--date ${{ github.event.inputs.date }}"; fi
          for attempt in 1 2 3; do
            git fetch -q origin main
            git reset -q --hard origin/main
            python3 patch_weekly_customs.py $DATE_ARG || { echo "Customs run failed; the next scheduled run will try again."; exit 0; }
            if git diff --quiet -- data/weekly-reports; then
              echo "Nothing to commit."
              exit 0
            fi
            REPORT=$(git diff --name-only -- data/weekly-reports | head -1 | sed 's#.*/console-##; s#\.json##')
            git add data/weekly-reports
            git commit -q -m "chore: console weekly report ${REPORT} revised: most customs (filled in by Actions, the routine's sandbox could not reach aoe2companion)"
            if git push -q origin HEAD:main; then
              echo "Pushed."
              exit 0
            fi
            echo "Push failed (attempt $attempt): another job committed first. Redoing it on the latest commit."
          done
          echo "Gave up after 3 attempts; the next scheduled run will try again."
          exit 0
