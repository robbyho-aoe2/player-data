name: Tests
on:
  push:
    paths:
      - "weekly_extras.py"
      - "rivalries.py"
      - "build_snapshot.py"
      - "test_weekly_extras.py"
      - "console_discovery.py"
      - "console_roster.py"
      - "test_console_discovery.py"
      - "data/weekly-reports/**"
  pull_request:
    paths:
      - "weekly_extras.py"
      - "rivalries.py"
      - "build_snapshot.py"
      - "test_weekly_extras.py"
      - "console_discovery.py"
      - "console_roster.py"
      - "test_console_discovery.py"
      - "data/weekly-reports/**"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            /*.py
            data/weekly-reports
          sparse-checkout-cone-mode: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run weekly-report regression tests
        run: python3 test_weekly_extras.py
      - name: Run console discovery tests
        run: |
          pip install requests websocket-client
          python3 test_console_discovery.py
